name: Complete portable snapshot links
on:
  push:
    branches: [main]
    paths: [.github/workflows/complete-snapshot-links.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore all manifest symlinks and preserve extracted modes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          root=Path.cwd();manifest=json.loads(Path('UPLOAD_MANIFEST.json').read_text());links=[x for x in manifest['files'] if x.get('type')=='symlink']
          for item in links:
            p=root/item['path'];p.parent.mkdir(parents=True,exist_ok=True)
            if p.is_symlink():
              if os.readlink(p)!=item['target']:raise RuntimeError('Unexpected symlink target: '+item['path'])
            elif p.exists():raise RuntimeError('Expected symlink, found regular file: '+item['path'])
            else:p.symlink_to(item['target'])
          subprocess.run(['git','add','-f','--']+[x['path'] for x in links],check=True)
          indexed=subprocess.check_output(['git','ls-files','-s','-z'])
          modes={row.split(b'\t',1)[1].decode():row.split(b' ',1)[0].decode() for row in indexed.split(b'\0') if row}
          for item in links:
            if modes.get(item['path'])!='120000':raise RuntimeError('Symlink not in index: '+item['path'])
          p=Path('scripts/restore_release_assets.py');source=p.read_text();needle='    with target.open(\'xb\') as out:\n     for block in iter(lambda:source.read(4*1024**2),b\'\'):out.write(block)'
          replacement=needle+'\n    os.chmod(target, member.mode & 0o777)'
          if 'os.chmod(target, member.mode & 0o777)' not in source:
            if needle not in source:raise RuntimeError('Unexpected restore script')
            p.write_text(source.replace(needle,replacement))
          print('Verified portable symlinks:',len(links))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/restore_release_assets.py
          git rm .github/workflows/complete-snapshot-links.yml
          git commit -m 'Preserve all experiment symlinks and restored file permissions'
          git push origin HEAD:main
